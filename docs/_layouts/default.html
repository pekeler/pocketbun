<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {%- seo -%}
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/pocketbun-docs.css' | relative_url }}" />
    {%- feed_meta -%}
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" href="{{ '/index.html' | relative_url }}">PocketBun Docs</a>
        {%- assign pocketbun_version = site.data.pocketbun.version -%}
        {%- if pocketbun_version -%}
          <span class="site-version">for v{{ pocketbun_version }}</span>
        {%- endif -%}
        <nav class="site-nav">
          <a class="page-link" href="{{ site.github.repository_url | default: 'https://github.com/pekeler/pocketbun' }}">Repository</a>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <a href="{{ '/index.html' | relative_url }}">PocketBun Docs</a>
      </div>
    </footer>
  </body>
</html>
