name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-command: bun test --concurrent --timeout 10000
            tests_timeout_minutes: 15
          - os: macos-latest
            test-command: bun test --concurrent --timeout 10000
            tests_timeout_minutes: 15
          - os: windows-2022
            test-command: bun test --concurrent --max-concurrency 8 --timeout 30000
            tests_timeout_minutes: 15

    steps:
      - name: Configure Git line endings (Windows)
        if: matrix.os == 'windows-2022'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned in CI to PocketBun's minimum supported Bun runtime.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Package typecheck
        run: bun run typecheck:package

      - name: Tests
        timeout-minutes: ${{ matrix.tests_timeout_minutes }}
        run: ${{ matrix.test-command }}

  e2e:
    name: E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned in CI to PocketBun's minimum supported Bun runtime.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run e2e:install

      - name: Playwright E2E
        run: bun run e2e
