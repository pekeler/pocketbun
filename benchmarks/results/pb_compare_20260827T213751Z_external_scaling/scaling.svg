<svg xmlns="http://www.w3.org/2000/svg" width="820" height="970" viewBox="0 0 820 970" role="img" aria-labelledby="title desc">
  <title id="title">PocketBase and PocketBun benchmark time and read throughput</title>
  <desc id="desc">Two aligned charts. The upper chart compares aggregate per-scenario median time for the complete suite, where lower is better. The lower chart compares requests per second for the 500-request, high-concurrency Go read route, where higher is better. Background bands identify the Hetzner CCX13, CCX23, and CCX33 hosts. Light green dots are the historical five-run median PocketBun 0.36.5 result at one lane.</desc>
  <rect width="820" height="970" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#24292f">
    <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="700">Benchmark time and read throughput</text>
    <text x="52" y="55" font-size="12">complete-suite aggregate (minutes — lower is better)</text>
    <g><rect x="80" y="80" width="155" height="420" fill="#fffdf2"/><rect x="235" y="80" width="180" height="420" fill="#fff9df"/><rect x="415" y="80" width="365" height="420" fill="#fff5cc"/></g>
    <g stroke="#d0d7de" stroke-width="1"><path d="M80 500H780M80 395H780M80 290H780M80 185H780M80 80H780"/></g>
    <g font-size="12" text-anchor="end"><text x="72" y="504">0m</text><text x="72" y="399">5m</text><text x="72" y="294">10m</text><text x="72" y="189">15m</text><text x="72" y="84">20m</text></g>
    <path d="M100 78.5 L190 166.3 L280 272.1 L370 281.6 L460 330.7 L550 329.2 L640 329.5 L730 330.4" fill="none" stroke="#54aeff" stroke-width="3"/>
    <path d="M100 315.0 L190 340.6 L280 393.5 L370 400.8 L460 426.2 L550 429.6 L640 430.7 L730 433.9" fill="none" stroke="#1a7f37" stroke-width="3"/>
