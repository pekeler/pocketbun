    <g fill="#1a7f37"><circle cx="100" cy="315" r="6"/><circle cx="190" cy="340.6" r="6"/><circle cx="280" cy="393.5" r="6"/><circle cx="370" cy="400.8" r="6"/><circle cx="460" cy="426.2" r="6"/><circle cx="550" cy="429.6" r="6"/><circle cx="640" cy="430.7" r="6"/><circle cx="730" cy="433.9" r="6"/></g>
    <circle cx="100" cy="289.4" r="6" fill="#80d69d"/>
    <g font-size="13"><text x="720" y="322" text-anchor="end" fill="#54aeff">PocketBase</text><text x="720" y="428" text-anchor="end" fill="#1a7f37">PocketBun</text><text x="112" y="292" fill="#80d69d">PocketBun 0.36.5</text></g>

    <text x="52" y="555" font-size="12">500-request Go read route (requests per second — higher is better)</text>
    <g><rect x="80" y="580" width="155" height="300" fill="#fffdf2"/><rect x="235" y="580" width="180" height="300" fill="#fff9df"/><rect x="415" y="580" width="365" height="300" fill="#fff5cc"/></g>
    <g stroke="#d0d7de" stroke-width="1"><path d="M80 880H780M80 805H780M80 730H780M80 655H780M80 580H780"/></g>
    <g font-size="12" text-anchor="end"><text x="72" y="884">0 r/s</text><text x="72" y="809">150 r/s</text><text x="72" y="734">300 r/s</text><text x="72" y="659">450 r/s</text><text x="72" y="584">600 r/s</text></g>
